<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090e18">
<title>Sameh Al Qubaisi — Co-founder &amp; Executive Chairman, Noor</title>
<meta name="description" content="Sameh Al Qubaisi, Co-founder &amp; Executive Chairman at Noor — a guiding star for your money.">
<meta property="og:title" content="Sameh Al Qubaisi — Co-founder &amp; Executive Chairman, Noor">
<meta property="og:description" content="Noor — a guiding star for your money. Save my contact in one tap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Noor website look: dark #090e18, glow, frosted glass, Sora + Inter + IBM Plex Mono */
  :root{
    --bg:#090e18; --white:#fff; --w70:rgba(255,255,255,.7); --w50:rgba(255,255,255,.5);
    --w12:rgba(255,255,255,.12); --w08:rgba(255,255,255,.08); --w05:rgba(255,255,255,.05);
    --terra:#FF6757; --sky:#337DFF; --r:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;background:var(--bg)}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--white);
       -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}

  .page{position:relative;display:flex;justify-content:center;align-items:flex-start;gap:48px}
  /* glow: terracotta + blue light at the top, dissolving into the dark page */
  .glow{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .glow::before,.glow::after{content:"";position:absolute;border-radius:50%;filter:blur(80px)}
  .glow::before{width:520px;height:520px;left:50%;top:-300px;transform:translateX(-10%);
                background:radial-gradient(circle,rgba(255,103,87,.55),rgba(255,103,87,0) 70%)}
  .glow::after{width:560px;height:560px;left:50%;top:-220px;transform:translateX(-85%);
               background:radial-gradient(circle,rgba(51,125,255,.45),rgba(51,125,255,0) 70%)}

  .card{position:relative;width:100%;max-width:440px;min-height:100vh;display:flex;flex-direction:column;
        padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .brand{display:flex;flex-direction:column;align-items:flex-start;color:var(--terra)}
  .brand svg{height:26px;width:auto}
  .brand span{font-weight:500;font-size:11px;margin-top:2px}
  .tag{flex:0 0 auto;white-space:nowrap;padding:6px 16px;border:1.5px solid var(--terra);border-radius:100px;
       color:var(--terra);font-size:14px;font-weight:500}

  .who{margin-top:44px}
  .photo{width:104px;height:104px;border-radius:50%;object-fit:cover;background:var(--w08);
         box-shadow:0 0 0 1px var(--w12),0 12px 40px rgba(0,0,0,.4)}
  .over{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.08em;
        text-transform:uppercase;color:var(--w50)}
  .who .over{margin-top:28px}
  h1{font-family:Sora,sans-serif;font-weight:600;font-size:38px;line-height:1.08;letter-spacing:-.01em;margin-top:10px}
  .role{margin-top:10px;font-size:17px;color:var(--w70)}

  .actions{display:flex;gap:10px;margin-top:32px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:100px;
       font-weight:600;font-size:16px;cursor:pointer;border:0;transition:transform .15s,background .15s}
  .btn:active{transform:scale(.98)}
  .btn svg{width:20px;height:20px}
  .btn-white{flex:1;background:var(--white);color:var(--bg)}
  .btn-ghost{flex:0 0 54px;background:var(--w05);color:var(--white);box-shadow:inset 0 0 0 1px var(--w12)}

  .glass{background:var(--w05);box-shadow:inset 0 0 0 1px var(--w08);border-radius:var(--r);
         -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
  .section{margin-top:32px}
  .section > .over{margin-bottom:12px}
  .links{display:flex;flex-direction:column;gap:8px}
  .link{display:flex;align-items:center;gap:14px;padding:12px 14px;transition:background .15s}
  .link:active{background:var(--w08)}
  .ico{flex:0 0 42px;width:42px;height:42px;border-radius:50%;background:var(--w08);display:grid;place-items:center}
  .ico svg{width:20px;height:20px;stroke:var(--white);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ico .in{font-family:Sora,sans-serif;font-weight:700;font-size:16px;letter-spacing:-.5px}
  .lt{min-width:0;flex:1}
  .lt b{display:block;font-weight:600;font-size:16px}
  .lt small{display:block;font-size:13px;color:var(--w50);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .arr{flex:0 0 auto;width:18px;height:18px;stroke:var(--w50);fill:none;stroke-width:2}

  .about{padding:20px}
  .about h2{font-family:Sora,sans-serif;font-weight:600;font-size:19px;line-height:1.25}
  .about ul{display:flex;flex-direction:column;gap:10px}
  .about li{list-style:none;font-size:15px;line-height:1.45;color:var(--w70);padding-left:24px;position:relative}
  .about li::before{content:"✓";position:absolute;left:0;color:var(--terra);font-weight:600}

  .foot{margin-top:auto;padding-top:40px;display:flex;flex-direction:column;gap:6px}
  .foot p{font-family:Sora,sans-serif;font-weight:600;font-size:18px;line-height:1.3;color:var(--w70)}
  .foot .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}
  .foot a.over:hover{color:var(--white)}

  /* entrance: fade-up like the site */
  .rise{opacity:0;transform:translateY(24px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none}}

  .qr-panel{display:none}
  @media (min-width:900px){
    .page{padding:64px 24px;align-items:center;min-height:100vh}
    .card{min-height:auto;border-radius:32px;padding:32px 28px}
    .qr-panel{display:flex;flex-direction:column;gap:14px;width:280px;position:relative}
    .qr-box{padding:20px;background:var(--white);border-radius:var(--r)}
    .qr-box canvas,.qr-box img{display:block;width:100%!important;height:auto!important}
    .qr-panel h3{font-family:Sora,sans-serif;font-weight:600;font-size:20px}
    .qr-panel p{font-size:15px;color:var(--w70);line-height:1.4}
  }
  .toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:var(--white);color:var(--bg);
         padding:12px 20px;border-radius:100px;font-size:15px;font-weight:500;opacity:0;transition:.2s;pointer-events:none}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

    "email": "sameh@CHANGE-ME.com",
    "phone": "",
    "website": "https://CHANGE-ME.com"
  },
  "vcf": "Sameh-Al-Qubaisi-Noor.vcf"
};

const ICONS = {
  linkedin: '<span class="in">in</span>',
  telegram: '<svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>',
  whatsapp: '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.5A8.5 8.5 0 1 1 21 11.5z"/></svg>',
  x:        '<svg viewBox="0 0 24 24"><path d="M4 4l16 16M20 4 4 20"/></svg>',
  email:    '<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>',
  phone:    '<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  website:  '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>'
};
const LABELS = {linkedin:"LinkedIn",telegram:"Telegram",whatsapp:"WhatsApp",x:"X",email:"Email",phone:"Phone",website:"Website"};
const pretty = (k,v) => k==="email"||k==="phone" ? v : v.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,"");
const href = (k,v) => k==="email" ? "mailto:"+v : k==="phone" ? "tel:"+v.replace(/[^\d+]/g,"") : v;

const full = CARD.firstName+" "+CARD.lastName;
const L = CARD.links;
document.getElementById("name").textContent = full;
document.getElementById("role").textContent = CARD.role+", "+CARD.company;
document.getElementById("bio").innerHTML = CARD.bio.map(b=>"<li>"+b+"</li>").join("");
if (L.website) document.getElementById("site").textContent = pretty("website",L.website);
document.getElementById("links").innerHTML = Object.keys(LABELS).filter(k=>L[k]).map(k =>
  `<a class="link glass" href="${href(k,L[k])}" ${k==="email"||k==="phone"?"":'target="_blank" rel="noopener"'}>
     <span class="ico">${ICONS[k]}</span>
     <span class="lt"><b>${LABELS[k]}</b><small>${pretty(k,L[k])}</small></span>
     <svg class="arr" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></a>`).join("");

function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}

// vCard: one tap → the phone offers "Add to contacts"
document.getElementById("save").onclick = () => {
  const photo = document.querySelector(".photo").src.split(",")[1];
  const v = ["BEGIN:VCARD","VERSION:3.0",
    `N:${CARD.lastName};${CARD.firstName};;;`,`FN:${full}`,`ORG:${CARD.company}`,`TITLE:${CARD.role}`,
    L.email?`EMAIL;TYPE=WORK:${L.email}`:"", L.phone?`TEL;TYPE=CELL:${L.phone}`:"",
    L.website?`URL:${L.website}`:"", L.linkedin?`X-SOCIALPROFILE;TYPE=linkedin:${L.linkedin}`:"",
    L.telegram?`X-SOCIALPROFILE;TYPE=telegram:${L.telegram}`:"",
    `NOTE:${CARD.role}, ${CARD.company} — ${location.href}`,
    `PHOTO;ENCODING=b;TYPE=JPEG:${photo}`,"END:VCARD"].filter(Boolean).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([v],{type:"text/vcard"}));
  a.download = CARD.vcf; document.body.appendChild(a); a.click(); a.remove();
};

document.getElementById("share").onclick = async () => {
  const data = {title: full+" — "+CARD.role+", "+CARD.company, url: location.href};
  try { if (navigator.share) return await navigator.share(data);
        await navigator.clipboard.writeText(location.href); toast("Link copied"); }
  catch(e) {}
};

// Desktop only: QR with this page's own address
if (matchMedia("(min-width:900px)").matches && location.protocol.startsWith("http")) {
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
  s.onload = () => new QRCode(document.getElementById("qr"), {text: location.href, width: 240, height: 240,
                                   colorDark: "#090e18", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M});
  s.onerror = () => document.querySelector(".qr-panel").style.display = "none";
  document.head.appendChild(s);
} else { document.querySelector(".qr-panel").style.display = "none"; }
</script>
</body>
</html>
