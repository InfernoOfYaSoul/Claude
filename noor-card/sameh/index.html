<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090E18">
<title>Sameh Al Qubaisi — Co-founder &amp; Executive Chairman, Noor</title>
<meta name="description" content="Sameh Al Qubaisi, Co-founder & Executive Chairman at Noor — AI-driven Installments to Agentic Bank.">
<meta property="og:title" content="Sameh Al Qubaisi — Co-founder & Executive Chairman, Noor">
<meta property="og:description" content="AI-driven Installments to Agentic Bank. Save my contact in one tap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Noor tokens (from the presentation kit) */
  :root{
    --black:#000; --n15:#282829; --n40:#717172; --n50:#8C8C8D; --n60:#979899;
    --n90:#E1E1E3; --n92:#EDEEF0; --n95:#F7F8FA; --white:#fff;
    --terra:#FF6757; --sky40:#337DFF; --sky55:#71B4FF; --sky80:#D8EBFF; --sky90:#F0F7FF;
    --dark:#090E18; --r:24px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:Onest,system-ui,sans-serif;background:var(--n95);color:var(--black);
       -webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .page{display:flex;justify-content:center;align-items:flex-start;gap:48px;padding:0}
  .card{width:100%;max-width:440px;background:var(--white);min-height:100vh;display:flex;flex-direction:column}

  /* Hero — the deck's dark cover with blurred terracotta/blue light */
  .hero{position:relative;overflow:hidden;background:var(--dark);color:var(--white);
        padding:calc(24px + env(safe-area-inset-top)) 24px 160px}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:220px;
        background:linear-gradient(to bottom,rgba(255,255,255,0) 0%,rgba(255,255,255,.03) 15%,rgba(255,255,255,.12) 30%,rgba(255,255,255,.28) 45%,rgba(255,255,255,.5) 60%,rgba(255,255,255,.74) 75%,rgba(255,255,255,.92) 88%,#fff 100%)}
  .hero::before{content:"";position:absolute;right:-160px;top:-180px;width:520px;height:520px;border-radius:50%;
        background:radial-gradient(circle,#337DFF 0%,#FF6757 55%,transparent 75%);filter:blur(70px);opacity:.45}
  .hero > *{position:relative}
  .brand{display:flex;flex-direction:column;align-items:flex-start}
  .brand svg{height:28px;width:auto}
  .brand span{font-weight:500;font-size:11px;color:var(--terra);margin-top:2px}
  .who{margin-top:40px;display:flex;flex-direction:column;align-items:flex-start;gap:20px}
  .photo{width:112px;height:112px;border-radius:50%;object-fit:cover;background:var(--n92);border:3px solid rgba(255,255,255,.14)}
  h1{font-family:Sora,sans-serif;font-weight:600;font-size:36px;line-height:1.1}
  .role{margin-top:8px;font-size:18px;color:rgba(255,255,255,.72)}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .tag{display:inline-flex;align-items:center;flex:0 0 auto;padding:6px 16px;white-space:nowrap;border:2px solid var(--terra);
       border-radius:100px;color:var(--terra);font-size:15px;font-weight:500}

  .body{padding:0 24px 24px;margin-top:-28px;position:relative;display:flex;flex-direction:column;gap:28px;flex:1}
  .actions{display:flex;gap:12px}
  .btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:72px;
       font-weight:700;font-size:17px;cursor:pointer;border:0;font-family:inherit}
  .btn-primary{background:var(--terra);color:var(--white)}
  .btn-ghost{background:var(--white);color:var(--black);border:2px solid var(--n90);flex:0 0 56px}
  .btn svg{width:22px;height:22px}

  .label{font-size:13px;font-weight:500;color:var(--n50);margin-bottom:12px}
  .links{display:flex;flex-direction:column;gap:8px}
  .link{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:var(--r);background:var(--n95)}
  .link:active{background:var(--n92)}
  .ico{flex:0 0 44px;width:44px;height:44px;border-radius:50%;background:var(--terra);display:grid;place-items:center}
  .ico svg{width:22px;height:22px;stroke:var(--white);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ico .in{font-family:Sora,sans-serif;font-weight:700;font-size:18px;color:var(--white);letter-spacing:-.5px}
  .lt{min-width:0;flex:1}
  .lt b{display:block;font-weight:600;font-size:17px}
  .lt small{display:block;font-size:14px;color:var(--n40);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arr{flex:0 0 auto;width:20px;height:20px;stroke:var(--n60);fill:none;stroke-width:2}

  .about{background:var(--sky90);border-radius:var(--r);padding:20px}
  .about h2{font-weight:600;font-size:18px;margin-bottom:10px}
  .about li{list-style:none;font-size:15px;line-height:1.45;padding-left:18px;position:relative;margin-top:8px}
  .about li::before{content:"→";position:absolute;left:0;color:var(--sky40)}

  .foot{padding:20px 24px calc(24px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;
        align-items:center;font-size:13px;color:var(--n60);border-top:1px solid var(--n92)}
  .foot b{font-family:Sora,sans-serif;font-weight:600;color:var(--n60)}

  /* Desktop: centred card + QR so people can scan it off a laptop screen */
  .qr-panel{display:none}
  @media (min-width:900px){
    .page{padding:48px 24px;align-items:center;min-height:100vh}
    .card{min-height:auto;border-radius:32px;overflow:hidden;box-shadow:0 2px 24px rgba(0,0,0,.08)}
    .qr-panel{display:flex;flex-direction:column;gap:16px;width:280px}
    .qr-box{background:var(--white);border-radius:var(--r);padding:24px;box-shadow:0 2px 24px rgba(0,0,0,.08)}
    .qr-box canvas,.qr-box img{display:block;width:100%!important;height:auto!important}
    .qr-panel p{font-size:15px;color:var(--n40);line-height:1.4}
    .qr-panel h3{font-weight:600;font-size:20px}
  }
  .toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:var(--black);color:var(--white);
         padding:12px 20px;border-radius:100px;font-size:15px;opacity:0;transition:.2s;pointer-events:none}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

  telegram: '<svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>',
  whatsapp: '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.5A8.5 8.5 0 1 1 21 11.5z"/></svg>',
  x:        '<svg viewBox="0 0 24 24"><path d="M4 4l16 16M20 4 4 20"/></svg>',
  email:    '<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>',
  phone:    '<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  website:  '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>'
};
const LABELS = {linkedin:"LinkedIn",telegram:"Telegram",whatsapp:"WhatsApp",x:"X",email:"Email",phone:"Phone",website:"Website"};
const pretty = (k,v) => k==="email"||k==="phone" ? v : v.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,"");
const href = (k,v) => k==="email" ? "mailto:"+v : k==="phone" ? "tel:"+v.replace(/[^\d+]/g,"") : v;

const full = CARD.firstName+" "+CARD.lastName;
document.getElementById("name").textContent = full;
document.getElementById("role").textContent = CARD.role+", "+CARD.company;
document.getElementById("bio").innerHTML = CARD.bio.map(b=>"<li>"+b+"</li>").join("");
const L = CARD.links;
if (L.website) document.getElementById("site").textContent = pretty("website",L.website);
document.getElementById("links").innerHTML = Object.keys(LABELS).filter(k=>L[k]).map(k =>
  `<a class="link" href="${href(k,L[k])}" ${k==="email"||k==="phone"?"":'target="_blank" rel="noopener"'}>
     <span class="ico">${ICONS[k]}</span>
     <span class="lt"><b>${LABELS[k]}</b><small>${pretty(k,L[k])}</small></span>
     <svg class="arr" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></a>`).join("");

function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}

// vCard: one tap → phone offers "Add to contacts"
document.getElementById("save").onclick = () => {
  const photo = document.querySelector(".photo").src.split(",")[1];
  const v = ["BEGIN:VCARD","VERSION:3.0",
    `N:${CARD.lastName};${CARD.firstName};;;`,`FN:${full}`,`ORG:${CARD.company}`,`TITLE:${CARD.role}`,
    L.email?`EMAIL;TYPE=WORK:${L.email}`:"", L.phone?`TEL;TYPE=CELL:${L.phone}`:"",
    L.website?`URL:${L.website}`:"", L.linkedin?`X-SOCIALPROFILE;TYPE=linkedin:${L.linkedin}`:"",
    L.telegram?`X-SOCIALPROFILE;TYPE=telegram:${L.telegram}`:"",
    `NOTE:${CARD.role}, ${CARD.company} — ${location.href}`,
    `PHOTO;ENCODING=b;TYPE=JPEG:${photo}`,"END:VCARD"].filter(Boolean).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([v],{type:"text/vcard"}));
  a.download = "Sameh-Al-Qubaisi-Noor.vcf"; document.body.appendChild(a); a.click(); a.remove();
};

document.getElementById("share").onclick = async () => {
  const data = {title: full+" — "+CARD.role+", "+CARD.company, url: location.href};
  try { if (navigator.share) return await navigator.share(data);
        await navigator.clipboard.writeText(location.href); toast("Link copied"); }
  catch(e) {}
};

// Desktop only: QR with this page's own address
if (matchMedia("(min-width:900px)").matches && location.protocol.startsWith("http")) {
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
  s.onload = () => new QRCode(document.getElementById("qr"), {text: location.href, width: 232, height: 232,
                                   colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M});
  s.onerror = () => document.querySelector(".qr-panel").style.display = "none";
  document.head.appendChild(s);
} else { document.querySelector(".qr-panel").style.display = "none"; }
</script>
</body>
</html>
